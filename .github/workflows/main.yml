
name: Build XLauncher APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build XLauncher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          unzip -q XLauncher.zip -d extracted

          SETTINGS=$(find extracted -name settings.gradle.kts -o -name settings.gradle | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Gradle project not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Setup Android SDK
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "APK successfully generated!"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XLauncher-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
